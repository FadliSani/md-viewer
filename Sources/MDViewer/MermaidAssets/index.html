<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #out { display: flex; justify-content: center; padding: 4px 0; }
  #out svg { max-width: 100%; height: auto; }
  #error {
    color: #ff453a;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    align-self: flex-start;
  }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="out"></div>
<script>
  let counter = 0;
  let latest = 0;
  const out = document.getElementById('out');

  function reportHeight() {
    const height = Math.ceil(out.getBoundingClientRect().height);
    window.webkit.messageHandlers.size.postMessage(height);
  }
  new ResizeObserver(reportHeight).observe(out);

  async function render(source, dark) {
    const id = 'diagram' + counter++;
    const mine = ++latest;
    mermaid.initialize({
      startOnLoad: false,
      theme: dark ? 'dark' : 'default',
      securityLevel: 'strict',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif'
    });
    try {
      const { svg } = await mermaid.render(id, source);
      if (mine !== latest) return; // a newer render superseded this one
      out.innerHTML = svg;
    } catch (error) {
      // Mermaid leaves its scratch elements behind on failure.
      document.querySelectorAll('#d' + id + ', #' + id).forEach(el => el.remove());
      if (mine !== latest) return;
      const message = document.createElement('div');
      message.id = 'error';
      message.textContent = (error && error.message) ? error.message : String(error);
      out.replaceChildren(message);
    }
    reportHeight();
  }
</script>
</body>
</html>
